[project]
name = "kholle-live"
version = "0.1.0"
description = "Khôlle vocale : tableau sur tablette, vérification SymPy, compte-rendu"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "gradbot>=0.2.0",
    "jinja2>=3.1.6",
    "openai>=3.19.2",
    "pipelex-sdk>=0.12.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sympy>=1.14.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
