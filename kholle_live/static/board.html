<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Tableau</title>
  <!-- [lane B] Page tablette : dessin au stylet ou au doigt, envoi du PNG au serveur. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.9/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.9/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.18.9/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    :root { --encre: #111; --bord: #d0d0d0; --doux: #666; --fond-barre: #f4f4f4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #fff; color: var(--encre); }
    body { font-family: system-ui, sans-serif; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    header { padding: 10px 16px 8px; border-bottom: 1px solid var(--bord); background: var(--fond-barre); }
    #enonce { margin: 0 0 8px; font-size: 1.1rem; line-height: 1.4; }
    .outils { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, .bouton, select { font: inherit; font-size: 1rem; min-height: 44px; padding: 0 16px; border: 1px solid var(--bord); border-radius: 8px; background: #fff; color: var(--encre); touch-action: manipulation; cursor: pointer; }
    button:active, .bouton:active { background: #e8e8e8; }
    .bouton { display: inline-flex; align-items: center; }
    .bouton input { display: none; }
    #statut { margin-left: auto; color: var(--doux); font-size: 0.9rem; min-width: 7em; text-align: right; }
    #statut.erreur { color: #b00020; }
    #eval-bascule { font-size: 0.85rem; min-height: 36px; padding: 0 10px; color: var(--doux); }
    #eval-outils { display: none; gap: 8px; align-items: center; }
    #eval-outils.visible { display: flex; }
    main { flex: 1; position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; background: #fff; cursor: crosshair; }
    canvas.gomme { cursor: none; }
    .modes { display: inline-flex; }
    .mode { min-height: 52px; min-width: 110px; font-size: 1.15rem; font-weight: 600; }
    .mode + .mode { margin-left: -1px; }
    .mode:first-child { border-radius: 8px 0 0 8px; }
    .mode:last-child { border-radius: 0 8px 8px 0; }
    .mode[aria-pressed="true"], .mode[aria-pressed="true"]:active { background: var(--encre); border-color: var(--encre); color: #fff; }
    #curseur-gomme { position: absolute; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px; border: 2px solid var(--doux); border-radius: 50%; background: rgba(255, 255, 255, 0.4); pointer-events: none; display: none; }
  </style>
</head>
<body>
  <header>
    <p id="enonce">Chargement de l'énoncé…</p>
    <div class="outils">
      <span class="modes" role="group" aria-label="Outil">
        <button id="stylo" class="mode" type="button" aria-pressed="true">Stylo</button>
        <button id="gomme" class="mode" type="button" aria-pressed="false">Gomme</button>
      </span>
      <button id="annuler" type="button">Annuler le trait</button>
      <button id="effacer" type="button">Tout effacer</button>
      <label class="bouton">Photo<input id="photo" type="file" accept="image/*" capture="environment"></label>
      <button id="eval-bascule" type="button" aria-pressed="false">éval</button>
      <span id="eval-outils">
        <select id="eval-label" aria-label="Échantillon"></select>
        <button id="eval-enregistrer" type="button">Enregistrer</button>
      </span>
      <span id="statut" role="status"></span>
    </div>
  </header>
  <main><canvas id="tableau"></canvas><div id="curseur-gomme"></div></main>

  <script>
    const ATTENTE_MS = 1500;
    const LARGEUR_MAX = 1400;
    const MARGE = 24;
    const EPAISSEUR = 3;
    const RAYON_GOMME = 20;

    const canvas = document.getElementById("tableau");
    const ctx = canvas.getContext("2d");
    const statut = document.getElementById("statut");
    const curseur = document.getElementById("curseur-gomme");

    // Chaque trait : liste de points en pixels CSS. Tout est redessiné depuis cette liste.
    // Un passage de gomme est un trait comme un autre (trait.gomme), tracé en blanc et large.
    let traits = [];
    let outil = "stylo";
    let enCours = new Map();  // pointerId -> trait
    let version = 0;
    let versionEnvoyee = 0;
    let minuteur = null;

    function dire(texte, erreur = false) {
      statut.textContent = texte;
      statut.classList.toggle("erreur", erreur);
    }

    // --- Énoncé ---
    fetch("/api/exercise").then(r => r.json()).then(ex => {
      const enonce = document.getElementById("enonce");
      enonce.textContent = ex.enonce_latex;
      const rendre = () => renderMathInElement(enonce, { delimiters: [{ left: "$", right: "$", display: false }] });
      window.renderMathInElement ? rendre() : window.addEventListener("load", rendre);
    }).catch(() => { document.getElementById("enonce").textContent = "Énoncé indisponible."; });

    // --- Dessin ---
    function redimensionner() {
      const ratio = window.devicePixelRatio || 1;
      const { width, height } = canvas.getBoundingClientRect();
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      redessiner();
    }

    function tracer(c, trait, debut = 0) {
      const largeur = trait.gomme ? 2 * RAYON_GOMME : EPAISSEUR;
      c.lineWidth = largeur;
      c.lineCap = "round";
      c.lineJoin = "round";
      c.strokeStyle = c.fillStyle = trait.gomme ? "#fff" : "#000";
      if (trait.length - debut === 1) {
        c.beginPath();
        c.arc(trait[debut][0], trait[debut][1], largeur / 2, 0, 2 * Math.PI);
        c.fill();
        return;
      }
      c.beginPath();
      c.moveTo(trait[debut][0], trait[debut][1]);
      for (let i = debut + 1; i < trait.length; i++) c.lineTo(trait[i][0], trait[i][1]);
      c.stroke();
    }

    function redessiner() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const t of traits) tracer(ctx, t);
    }

    function point(e) {
      const r = canvas.getBoundingClientRect();
      return [e.clientX - r.left, e.clientY - r.top];
    }

    // --- Outils : stylo ou gomme ---
    function choisirOutil(nom) {
      outil = nom;
      for (const b of document.querySelectorAll(".mode")) b.setAttribute("aria-pressed", String(b.id === nom));
      canvas.classList.toggle("gomme", nom === "gomme");
      cacherCurseur();
    }
    document.getElementById("stylo").addEventListener("click", () => choisirOutil("stylo"));
    document.getElementById("gomme").addEventListener("click", () => choisirOutil("gomme"));

    function placerCurseur(e) {
      const [x, y] = point(e);
      curseur.style.transform = `translate(${x}px, ${y}px)`;
      curseur.style.display = "block";
    }
    function cacherCurseur() { curseur.style.display = "none"; }

    canvas.addEventListener("pointerdown", e => {
      // Le stylet a la priorité : la paume posée avant ou pendant qu'il écrit est ignorée.
      if (e.pointerType === "touch" && [...enCours.values()].some(t => t.stylet)) return;
      if (e.pointerType === "pen") {
        for (const [id, t] of enCours) if (!t.stylet) { enCours.delete(id); traits.splice(traits.indexOf(t), 1); }
        redessiner();
      }
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      const trait = [point(e)];
      trait.stylet = e.pointerType === "pen";
      trait.gomme = outil === "gomme";
      enCours.set(e.pointerId, trait);
      traits.push(trait);
      clearTimeout(minuteur);
      tracer(ctx, trait);
      if (trait.gomme) placerCurseur(e);
    });

    canvas.addEventListener("pointermove", e => {
      const trait = enCours.get(e.pointerId);
      // Le cercle suit aussi la souris ou le stylet en survol, jamais une paume.
      if (outil === "gomme" && (trait || e.pointerType !== "touch")) placerCurseur(e);
      if (!trait) return;
      e.preventDefault();
      const evenements = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      const debut = trait.length - 1;
      for (const ev of evenements.length ? evenements : [e]) trait.push(point(ev));
      tracer(ctx, trait, debut);
    });

    // Gommer compte comme écrire : même envoi 1,5 s après le dernier trait.
    function finTrait(e) {
      if (!enCours.delete(e.pointerId)) return;
      cacherCurseur();
      version++;
      planifierEnvoi();
    }
    canvas.addEventListener("pointerup", finTrait);
    canvas.addEventListener("pointercancel", finTrait);
    canvas.addEventListener("pointerleave", e => { if (!enCours.has(e.pointerId)) cacherCurseur(); });

    document.getElementById("annuler").addEventListener("click", () => {
      if (!traits.length) return;
      traits.pop();
      version++;
      redessiner();
      planifierEnvoi();
    });

    document.getElementById("effacer").addEventListener("click", () => {
      if (!traits.length) return;
      traits = [];
      enCours.clear();
      version++;
      redessiner();
      planifierEnvoi();
    });

    // --- Export PNG : encre noire sur fond blanc (la gomme repeint en blanc), recadré sur l'encre ---
    function exporter() {
      const r = canvas.getBoundingClientRect();
      const encre = traits.filter(t => !t.gomme);
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const t of encre) for (const [x, y] of t) {
        x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
      }
      if (!encre.length) { x0 = 0; y0 = 0; x1 = Math.min(r.width, 400); y1 = Math.min(r.height, 200); }
      x0 = Math.max(0, x0 - MARGE); y0 = Math.max(0, y0 - MARGE);
      x1 = Math.min(r.width, x1 + MARGE); y1 = Math.min(r.height, y1 + MARGE);
      const largeur = Math.max(1, x1 - x0), hauteur = Math.max(1, y1 - y0);
      const echelle = Math.min(LARGEUR_MAX / largeur, window.devicePixelRatio || 1, 2);

      const sortie = document.createElement("canvas");
      sortie.width = Math.round(largeur * echelle);
      sortie.height = Math.round(hauteur * echelle);
      const c = sortie.getContext("2d");
      c.fillStyle = "#fff";
      c.fillRect(0, 0, sortie.width, sortie.height);
      c.setTransform(echelle, 0, 0, echelle, -x0 * echelle, -y0 * echelle);
      for (const t of traits) tracer(c, t);
      return new Promise(ok => sortie.toBlob(ok, "image/png"));
    }

    // --- Envoi après 1,5 s sans écrire ---
    function planifierEnvoi() {
      clearTimeout(minuteur);
      minuteur = setTimeout(envoyer, ATTENTE_MS);
    }

    async function envoyer() {
      if (enCours.size || version === versionEnvoyee) return;
      const v = version;
      try {
        const png = await exporter();
        await poster("/api/board", png, "image/png");
        versionEnvoyee = v;
        dire("envoyé ✓");
      } catch (err) {
        dire("hors ligne, nouvel essai…", true);
        planifierEnvoi();
      }
    }

    async function poster(url, corps, type) {
      const r = await fetch(url, { method: "POST", body: corps, headers: { "Content-Type": type || "application/octet-stream" } });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    // --- Photo (repli papier + téléphone) : envoyée telle quelle ---
    document.getElementById("photo").addEventListener("change", async e => {
      const fichier = e.target.files[0];
      e.target.value = "";
      if (!fichier) return;
      dire("envoi de la photo…");
      try {
        await poster("/api/board", fichier, fichier.type);
        dire("photo envoyée ✓");
      } catch (err) {
        dire("échec de l'envoi de la photo", true);
      }
    });

    // --- Échantillons d'évaluation ---
    const choix = document.getElementById("eval-label");
    for (const lettre of ["C", "E"]) for (let i = 1; i <= 7; i++) choix.add(new Option(lettre + i, lettre + i));

    document.getElementById("eval-bascule").addEventListener("click", e => {
      const visible = document.getElementById("eval-outils").classList.toggle("visible");
      e.currentTarget.setAttribute("aria-pressed", String(visible));
    });

    document.getElementById("eval-enregistrer").addEventListener("click", async () => {
      if (!traits.some(t => !t.gomme)) { dire("tableau vide", true); return; }
      const label = choix.value;
      try {
        await poster(`/api/eval/sample?label=${encodeURIComponent(label)}`, await exporter(), "image/png");
        dire(`${label} enregistré ✓`);
        if (choix.selectedIndex < choix.options.length - 1) choix.selectedIndex++;
      } catch (err) {
        dire(`échec de l'enregistrement de ${label}`, true);
      }
    });

    new ResizeObserver(redimensionner).observe(canvas);
    redimensionner();
  </script>
</body>
</html>
